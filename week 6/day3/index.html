<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #000000;
            border-radius: 5px;
        }

        input,
        textarea {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
        }

        button {
            padding: 8px 15px;
            margin-right: 10px;
        }
    </style>
</head>

<body>

    <div id="mainContainer">
        <div class="container">
            <h2>Contact Us</h2>

            <input type="text" id="name" placeholder="Enter Name">

            <input type="email" id="email" placeholder="Enter Email">

            <textarea id="message" rows="4" placeholder="Enter Message"></textarea>

            <button onclick="submitData()">Submit</button>
            <button onclick="updateData()">Update</button>
        </div>
        <div class="container">
            <h2>Details</h2>

            <input type="text" id="details-name" placeholder="Enter Name">

            <input type="email" id="details-email" placeholder="Enter Email">

            <textarea id="details-message" rows="4" placeholder="Enter Message"></textarea>

            <button onclick="editData()">Edit</button>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>

</html>
