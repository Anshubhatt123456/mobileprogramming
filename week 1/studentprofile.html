<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>
<style>
    .main-container{
        display:flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .card {
        width: 300px;
        border: 1px solid #ccc;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
    }
        .card:hover {
        background-color: #eef2ff;
    }
    #img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        margin-bottom: 15px;
    }
    #name{
        margin: 0;
        font-size: 24px;
    }
    .info {
        margin: 5px 0;
        color: #555;
    }
</style>
</head> 
<body>
   <div class="main-container"> 
    <div class="card">
        <img id="img" src="https://i.pinimg.com/736x/a4/f9/d6/a4f9d6d4093e663277c009a40602584e.jpg" alt="Profile Picture">
        <h2 id="name">Anshu Bhatt</h2>
        <p class="info">Bsc.it Student</p>
        <p class="info">Presidential graduate school</p>
    </div>
</div>
</body>
</html>
